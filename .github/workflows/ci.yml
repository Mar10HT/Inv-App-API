name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # prisma validate/generate resolve env("DATABASE_URL") from the schema
      # even though neither actually connects to a database — any
      # syntactically valid URL for the declared provider satisfies it here.
      # schema.prisma now declares postgresql (dev moved off SQLite), so this
      # needs the matching protocol even though nothing here dials out to it.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Validate Prisma schema
        run: bunx prisma validate --schema=./prisma/schema.prisma

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
