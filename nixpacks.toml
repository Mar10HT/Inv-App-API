[phases.setup]
nixPkgs = ["nodejs_22", "bun"]
# Prisma's debian-openssl-3.0.x engine binary needs libssl.so.3 at runtime.
# Installing it via apt puts it in the standard system library path (already
# in ldconfig's default search path on Debian), which persists into the final
# image — unlike the previous approach (nix's openssl package + a manual
# find/ldconfig hack), which left the container unable to find it at runtime.
aptPkgs = ["openssl"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "bun install --frozen-lockfile",
  "bunx prisma generate --schema=./prisma/schema.prod.prisma",
  "bun run build"
]
