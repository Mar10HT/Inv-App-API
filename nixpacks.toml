[phases.setup]
nixPkgs = ["nodejs_20", "openssl_3", "bun"]
aptPkgs = ["libssl3"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "find / -name 'libssl.so.3' 2>/dev/null | head -5",
  "ln -sf $(find / -name 'libssl.so.3' -print -quit 2>/dev/null) /usr/lib/libssl.so.3 || true",
  "ldconfig 2>/dev/null || true",
  "bun install --frozen-lockfile",
  "bunx prisma generate --schema=./prisma/schema.prod.prisma",
  "bun run build"
]

[start]
cmd = "export LD_LIBRARY_PATH=$(find /nix/store -maxdepth 3 -name 'libssl.so.3' -exec dirname {} \\; 2>/dev/null | head -1):/usr/lib:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH && prisma db push --schema=./prisma/schema.prod.prisma --skip-generate --accept-data-loss && bun dist/main"
