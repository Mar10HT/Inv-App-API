[phases.setup]
nixPkgs = ["nodejs_20", "openssl_3", "bun"]
aptPkgs = ["libssl3"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "bun install --frozen-lockfile",
  "bunx prisma generate --schema=./prisma/schema.prod.prisma",
  "bun run build"
]

[start]
cmd = "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH bun run start"
